# Docker Compose for Production with PM2
# Alternative deployment option using Docker containers

version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    container_name: mayhem-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5001
    env_file:
      - ./backend/.env.production
    ports:
      - "5001:5001"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    networks:
      - mayhem-network
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Email Service
  email-service:
    build:
      context: ./services
      dockerfile: Dockerfile.production
    container_name: mayhem-email-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5002
    env_file:
      - ./services/.env.production
    ports:
      - "5002:5002"
    volumes:
      - ./services/logs:/app/logs
    networks:
      - mayhem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mayhem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mayhem_creation
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    ports:
      - "3306:3306"
    networks:
      - mayhem-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis (for sessions/caching)
  redis:
    image: redis:7-alpine
    container_name: mayhem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mayhem-network
    command: redis-server --appendonly yes

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mayhem-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./frontend/dist:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    networks:
      - mayhem-network
    depends_on:
      - backend
      - email-service

volumes:
  mysql_data:
  redis_data:

networks:
  mayhem-network:
    driver: bridge
